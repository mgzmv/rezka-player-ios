workflows:
  ios-unsigned-ipa:
    name: Build RezkaPlayer Unsigned IPA (SideStore)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Generate app icon
        script: |
          python3 scripts/make_icon.py RezkaPlayer/Assets.xcassets/AppIcon.appiconset/icon.png
      - name: Generate Xcode project (fast prebuilt XcodeGen)
        script: |
          if command -v xcodegen &> /dev/null; then
            xcodegen generate
          else
            curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip -o xcodegen.zip
            unzip -q xcodegen.zip
            ./xcodegen/bin/xcodegen generate
          fi
      - name: Build unsigned .app
        script: |
          xcodebuild clean build \
            -project RezkaPlayer.xcodeproj \
            -scheme RezkaPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
      - name: Package RezkaPlayer.ipa
        script: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "RezkaPlayer.app" -type d | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r9 RezkaPlayer.ipa Payload
    artifacts:
      - RezkaPlayer.ipa
